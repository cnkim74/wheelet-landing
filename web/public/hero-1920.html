<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; }
  body {
    background:#0A0A0C;
    font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
    color:#F2F2F4; position:relative;
  }
  /* ambient gold glows */
  .glow1 { position:absolute; top:-360px; left:20%; width:1200px; height:900px;
    background:radial-gradient(closest-side, rgba(212,179,106,0.22), transparent 70%); filter:blur(10px); }
  .glow2 { position:absolute; bottom:-420px; right:-200px; width:1100px; height:1000px;
    background:radial-gradient(closest-side, rgba(111,191,138,0.10), transparent 70%); }
  .grid { position:absolute; inset:0; opacity:0.04;
    background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
    background-size:64px 64px; mask-image:radial-gradient(1400px 800px at 40% 30%, #000 40%, transparent 85%); }

  .wrap { position:relative; height:100%; display:flex; align-items:center; padding:0 120px; gap:70px; }
  .left { flex:1; max-width:1000px; }

  .brandrow { display:flex; align-items:center; gap:16px; margin-bottom:30px; }
  .mark { width:64px; height:64px; border-radius:18px;
    background:linear-gradient(140deg,#E9CD8D,#B78F3E); display:flex; align-items:center; justify-content:center;
    box-shadow:0 12px 40px rgba(212,179,106,0.35); }
  .mark svg { width:34px; height:34px; }
  .wordmark { font-size:40px; font-weight:900; letter-spacing:.5px;
    background:linear-gradient(90deg,#E9CD8D,#D4B36A); -webkit-background-clip:text; background-clip:text; color:transparent; }

  .eyebrow { font-size:16px; font-weight:700; letter-spacing:.42em; text-transform:uppercase; color:#D4B36A; margin-bottom:26px; }

  h1 { font-size:78px; font-weight:900; line-height:1.08; letter-spacing:-0.02em; }
  h1 .g { background:linear-gradient(90deg,#E9CD8D,#D4B36A 60%,#B78F3E); -webkit-background-clip:text; background-clip:text; color:transparent; }

  .sub { margin-top:30px; font-size:24px; line-height:1.6; color:#B9BAC2; max-width:720px; }

  .tags { margin-top:40px; display:flex; gap:12px; flex-wrap:wrap; }
  .tag { font-size:16px; font-weight:600; color:#D8DBE0; padding:11px 20px; border-radius:999px;
    border:1px solid rgba(212,179,106,0.35); background:rgba(212,179,106,0.06); }
  .tag b { color:#E9CD8D; font-weight:700; }

  .badges { margin-top:44px; display:flex; align-items:center; gap:18px; }
  .store { display:flex; align-items:center; gap:12px; height:60px; padding:0 24px; border-radius:14px;
    background:#fff; color:#0A0A0C; }
  .store svg { width:30px; height:30px; }
  .store .st { display:flex; flex-direction:column; line-height:1.05; }
  .store .st small { font-size:12px; font-weight:600; opacity:.7; }
  .store .st span { font-size:21px; font-weight:800; letter-spacing:-.01em; }
  .soon { font-size:15px; color:#8A8B93; }

  /* phone */
  .right { flex:0 0 auto; display:flex; align-items:center; justify-content:center; position:relative; }
  .phaura { position:absolute; width:640px; height:640px; border-radius:50%;
    background:radial-gradient(closest-side, rgba(212,179,106,0.28), transparent 70%); }
  .phone { position:relative; width:396px; height:auto; border-radius:52px; padding:12px;
    background:linear-gradient(160deg,#26262c,#0e0e12); box-shadow:0 50px 120px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05) inset;
    transform:rotate(-4deg); }
  .phone img { width:100%; display:block; border-radius:42px; }
  .notch { position:absolute; top:24px; left:50%; transform:translateX(-50%); width:120px; height:26px; background:#000; border-radius:16px; z-index:2; }
</style>
</head>
<body>
  <div class="glow1"></div>
  <div class="glow2"></div>
  <div class="grid"></div>

  <div class="wrap">
    <div class="left">
      <div class="brandrow">
        <div class="mark">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 13l2-5a3 3 0 0 1 2.8-2h8.4A3 3 0 0 1 19 8l2 5M5 13h14M6.5 17.5A1.5 1.5 0 1 0 6.5 14.5a1.5 1.5 0 0 0 0 3zM17.5 17.5A1.5 1.5 0 1 0 17.5 14.5a1.5 1.5 0 0 0 0 3z" stroke="#141414" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="wordmark">Wheelet</div>
      </div>

      <div class="eyebrow">Premium AI Car Ledger</div>

      <h1>차의 모든 지출,<br>AI가 알아서<br><span class="g">기록하고 아껴드립니다</span></h1>

      <p class="sub">충전·주유 자동 기록, 렌트 약정거리 예측, 월간 리포트까지 —<br>전기차·내연기관·오토바이를 한 곳에서.</p>

      <div class="tags">
        <span class="tag"><b>테슬라</b> 자동 연동</span>
        <span class="tag">영수증 <b>AI 스캔</b></span>
        <span class="tag"><b>현재 위치</b>·충전소</span>
        <span class="tag">월간 리포트</span>
      </div>

      <div class="badges">
        <div class="store">
          <svg viewBox="0 0 24 24" fill="#0A0A0C"><path d="M16.36 12.7c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.7-3.18-1.72-1.35-.14-2.64.79-3.32.79-.69 0-1.74-.77-2.86-.75-1.47.02-2.83.85-3.58 2.17-1.53 2.65-.39 6.57 1.09 8.72.72 1.05 1.58 2.23 2.71 2.19 1.09-.04 1.5-.7 2.82-.7 1.31 0 1.68.7 2.83.68 1.17-.02 1.91-1.07 2.62-2.13.83-1.22 1.17-2.4 1.19-2.46-.03-.01-2.28-.87-2.3-3.45zM14.19 6.2c.6-.73 1-1.74.89-2.75-.86.03-1.9.57-2.52 1.3-.55.64-1.04 1.67-.91 2.65.96.07 1.94-.49 2.54-1.2z"/></svg>
          <div class="st"><small>Download on the</small><span>App Store</span></div>
        </div>
        <span class="soon">· Google Play 곧 출시</span>
      </div>
    </div>

    <div class="right">
      <div class="phaura"></div>
      <div class="phone">
        <div class="notch"></div>
        <img src="phone.png" alt="Wheelet app home">
      </div>
    </div>
  </div>
</body>
</html>
